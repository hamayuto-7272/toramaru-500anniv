<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>500日記念</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="page">


    <!-- ========================================
         トラまる
    ======================================== -->

    <div
      id="toramaruWrapper"
      class="toramaru-wrapper"
    >

      <img
        id="toramaru"
        class="toramaru"
        src="images/toramaru.png"
        alt="トラまる"
      >

    </div>


    <!-- ========================================
         吹き出し
    ======================================== -->

    <div
      id="speechBubble"
      class="speech-bubble"
    >
      おう！ おいらはトラまるってんだ！
    </div>


    <!-- ========================================
         最初のボタン
    ======================================== -->

    <button
      id="startButton"
      class="start-button"
    >
      トラまる登場！
    </button>


    <!-- ========================================
         戻るボタン
    ======================================== -->

    <button
      id="backButton"
      class="back-button"
    >
      戻る
    </button>


    <!-- ========================================
         次へボタン
    ======================================== -->

    <button
      id="nextButton"
      class="next-button"
    >
      次へ
    </button>


    <!-- ========================================
         エンディング用カーテン
    ======================================== -->

    <div
      id="curtain"
      aria-hidden="true"
    >

      <!-- 上部の緞帳 -->

      <div class="curtain-valance">

        <div class="valance-fold fold-1"></div>
        <div class="valance-fold fold-2"></div>
        <div class="valance-fold fold-3"></div>
        <div class="valance-fold fold-4"></div>
        <div class="valance-fold fold-5"></div>

      </div>


      <!-- 左カーテン -->

      <div class="curtain-left"></div>


      <!-- 右カーテン -->

      <div class="curtain-right"></div>

    </div>


    <!-- ========================================
         エンドロール
    ======================================== -->

    <div
      id="endRoll"
      aria-hidden="true"
    >

      <div class="end-roll-content">


        <!-- ====================================
             THE END
        ==================================== -->

        <div class="end-title">
          THE END
        </div>


        <!-- ====================================
             CAST
        ==================================== -->

        <div class="credit-section">

          <div class="credit-heading">
            CAST
          </div>

          <div class="credit-name">
            トラまる
          </div>

        </div>


        <!-- ====================================
             SPECIAL THANKS
        ==================================== -->

        <div class="credit-section">

          <div class="credit-heading">
            SPECIAL THANKS
          </div>

          <div class="credit-name">
            あなた
          </div>

        </div>


        <!-- ====================================
             STAFF
        ==================================== -->

        <div class="staff-section">


          <div class="staff-row">

            <div class="staff-role">
              企画
            </div>

            <div class="staff-name">
              わたし
            </div>

          </div>


          <div class="staff-row">

            <div class="staff-role">
              演出
            </div>

            <div class="staff-name">
              わたし
            </div>

          </div>


          <div class="staff-row">

            <div class="staff-role">
              美術
            </div>

            <div class="staff-name">
              わたし
            </div>

          </div>


          <div class="staff-row">

            <div class="staff-role">
              出演
            </div>

            <div class="staff-name">
              トラまる
            </div>

          </div>


          <div class="staff-row">

            <div class="staff-role">
              脚本
            </div>

            <div class="staff-name">
              わたし
            </div>

          </div>


          <div class="staff-row">

            <div class="staff-role">
              監督
            </div>

            <div class="staff-name">
              わたし
            </div>

          </div>


        </div>


        <!-- ====================================
             最後のメッセージ
        ==================================== -->

        <div class="final-message">


          <div class="final-thanks">
            500日ありがとう。
          </div>


          <div class="final-next">
            これからの500日も、<br>
            よろしくお願いします。
          </div>


          <div class="final-heart">
            ♥
          </div>


          <div class="final-end">
            THE END
          </div>


        </div>


      </div>

    </div>


  </main>


  <!-- ========================================
       JavaScript
  ======================================== -->

  <script src="script.js"></script>

</body>

</html>
